# In-memory DB — no PostgreSQL needed for tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Flyway so H2 uses ddl-auto instead of the PostgreSQL migration scripts
spring.flyway.enabled=false

# Disable Redis autoconfiguration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Stub mail — no real SMTP needed
spring.mail.host=localhost
spring.mail.port=3025

# JWT values for tests
JWT_SECRET=test-secret-key-that-is-long-enough-for-hs256
JWT_EXPIRATION=3600
